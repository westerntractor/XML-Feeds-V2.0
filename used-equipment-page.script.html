<!--
  Paste into Webflow: Used Equipment page → Page Settings → Custom Code → Before </body>

  Prerequisites:
  - Finsweet Attributes (fs-list / fs-rangeslider) REMOVED from this page
  - Hidden *-ops lists REMOVED
  - Deploy GET /collection/used-equipment on Heroku (Western Sales app)
  - Update API_BASE below to your Heroku URL
-->
<style>
  .fs-rangeslider_track {
    position: relative;
  }
  .fs-rangeslider_fill {
    position: absolute;
    top: 0;
    height: 100%;
  }
  .fs-rangeslider_handle {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    touch-action: none;
    cursor: grab;
  }
  .fs-rangeslider_handle:active {
    cursor: grabbing;
  }
  .ue-pagination-status {
    display: inline-block;
    margin: 0 12px;
    vertical-align: middle;
  }
</style>
<script>
(function () {
  "use strict";

  var API_BASE =
    "https://appwswebsite-ce3c49259d6a.herokuapp.com/collection/used-equipment";
  var PAGE_SIZE = 12;
  var SEARCH_DEBOUNCE_MS = 350;
  var RANGE_DEBOUNCE_MS = 350;

  var els = {
    form:
      document.getElementById("email-form") ||
      document.querySelector(".c-search__form") ||
      document.querySelector("form.w-form"),
    grid: document.getElementById("main-list"),
    wrapper: document.getElementById("seamless-replace"),
    empty: null,
    pagination: null,
    search: document.getElementById("name"),
    category: document.getElementById("category"),
    make: document.getElementById("make"),
    model: document.getElementById("model"),
    location: document.getElementById("location"),
    yearMin: document.getElementById("field"),
    yearMax: document.getElementById("field-2"),
    priceMin: document.getElementById("field-3"),
    priceMax: document.getElementById("field-4"),
    reset: document.querySelector("a.reset-button.c-bavly"),
  };

  var cardTemplate = null;
  var slimSelects = {};
  var searchTimer = null;
  var rangeSliders = { year: null, price: null };
  var catalogBounds = {
    yearMin: 1990,
    yearMax: new Date().getFullYear(),
    priceMin: 0,
    priceMax: 1600000,
  };
  var loading = false;

  function commaNum(n) {
    if (typeof numberWithCommas === "function") return numberWithCommas(n);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function parseInputNumber(el) {
    if (!el || el.value == null || el.value === "") return null;
    var n = Number(String(el.value).replace(/,/g, ""));
    return isFinite(n) ? n : null;
  }

  function readFilters() {
    return {
      category: els.category ? els.category.value : "",
      make: els.make ? els.make.value : "",
      model: els.model ? els.model.value : "",
      location: els.location ? els.location.value : "",
      yearMin: parseInputNumber(els.yearMin),
      yearMax: parseInputNumber(els.yearMax),
      priceMin: parseInputNumber(els.priceMin),
      priceMax: parseInputNumber(els.priceMax),
      q: els.search ? els.search.value.trim() : "",
      page: readPageFromUrl(),
      limit: PAGE_SIZE,
    };
  }

  function readPageFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var page = parseInt(params.get("page") || "1", 10);
    return isFinite(page) && page > 0 ? page : 1;
  }

  function buildApiUrl(filters) {
    var params = new URLSearchParams();
    Object.keys(filters).forEach(function (key) {
      var val = filters[key];
      if (val != null && val !== "") params.set(key, String(val));
    });
    return API_BASE + "?" + params.toString();
  }

  function syncUrl(filters) {
    var params = new URLSearchParams();
    ["category", "make", "model", "location", "q"].forEach(function (key) {
      if (filters[key]) params.set(key, filters[key]);
    });
    if (filters.yearMin != null) params.set("yearMin", filters.yearMin);
    if (filters.yearMax != null) params.set("yearMax", filters.yearMax);
    if (filters.priceMin != null) params.set("priceMin", filters.priceMin);
    if (filters.priceMax != null) params.set("priceMax", filters.priceMax);
    if (filters.page > 1) params.set("page", filters.page);
    var qs = params.toString();
    var next = window.location.pathname + (qs ? "?" + qs : "");
    window.history.replaceState({}, "", next);
  }

  function applyFiltersFromUrl() {
    var params = new URLSearchParams(window.location.search);
    if (els.category && params.has("category"))
      els.category.value = params.get("category");
    if (els.make && params.has("make")) els.make.value = params.get("make");
    if (els.model && params.has("model")) els.model.value = params.get("model");
    if (els.location && params.has("location"))
      els.location.value = params.get("location");
    if (els.search && params.has("q")) els.search.value = params.get("q");
    if (els.yearMin && params.has("yearMin"))
      els.yearMin.value = params.get("yearMin");
    if (els.yearMax && params.has("yearMax"))
      els.yearMax.value = params.get("yearMax");
    if (els.priceMin && params.has("priceMin"))
      els.priceMin.value = params.get("priceMin");
    if (els.priceMax && params.has("priceMax"))
      els.priceMax.value = params.get("priceMax");
  }

  function applyCatalogBounds(bounds) {
    if (!bounds) return;
    if (bounds.yearMin != null) catalogBounds.yearMin = bounds.yearMin;
    if (bounds.yearMax != null) catalogBounds.yearMax = bounds.yearMax;
    if (bounds.priceMin != null) catalogBounds.priceMin = bounds.priceMin;
    if (bounds.priceMax != null) catalogBounds.priceMax = bounds.priceMax;

    if (rangeSliders.year) rangeSliders.year.setBounds(catalogBounds.yearMin, catalogBounds.yearMax);
    if (rangeSliders.price) rangeSliders.price.setBounds(catalogBounds.priceMin, catalogBounds.priceMax);
  }

  function destroySlimSelect(key) {
    if (slimSelects[key] && typeof slimSelects[key].destroy === "function") {
      slimSelects[key].destroy();
    }
    slimSelects[key] = null;
  }

  function initSlimSelect(key, selectEl) {
    if (!selectEl || typeof SlimSelect === "undefined") return;
    destroySlimSelect(key);
    slimSelects[key] = new SlimSelect({ select: selectEl });
  }

  function populateSelect(selectEl, options, selected) {
    if (!selectEl) return;
    selectEl.innerHTML = "";
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "Select one...";
    selectEl.appendChild(blank);
    options.forEach(function (opt) {
      var option = document.createElement("option");
      option.value = opt;
      option.textContent = opt;
      selectEl.appendChild(option);
    });
    if (selected && options.indexOf(selected) !== -1) {
      selectEl.value = selected;
    } else {
      selectEl.value = "";
    }
  }

  function updateSelectOptions(filterOptions, filters) {
    populateSelect(els.category, filterOptions.categories, filters.category);
    populateSelect(els.make, filterOptions.makes, filters.make);
    populateSelect(els.model, filterOptions.models, filters.model);
    populateSelect(els.location, filterOptions.locations, filters.location);

    initSlimSelect("category", els.category);
    initSlimSelect("make", els.make);
    initSlimSelect("model", els.model);
    initSlimSelect("location", els.location);

    if (els.category && filters.category) els.category.value = filters.category;
    if (els.make && filters.make) els.make.value = filters.make;
    if (els.model && filters.model) els.model.value = filters.model;
    if (els.location && filters.location) els.location.value = filters.location;
  }

  function ensureCardTemplate() {
    if (cardTemplate || !els.grid) return;
    var first = els.grid.querySelector(".listing-item.main-item");
    if (!first) {
      console.error("[used-equipment] No .listing-item.main-item template in #main-list");
      return;
    }
    cardTemplate = first.cloneNode(true);
  }

  function setField(root, selector, text) {
    var node = root.querySelector(selector);
    if (node) node.textContent = text != null ? String(text) : "";
  }

  function renderCard(machine) {
    var card = cardTemplate.cloneNode(true);
    var img = card.querySelector(".listing-image");
    if (img) {
      img.src = machine.image || img.src;
      img.alt = machine.name || "";
    }
    setField(card, ".year-block h3", machine.year || "");
    setField(card, ".make-block h3", machine.make || "");
    setField(card, ".model-block h3", machine.model || "");
    setField(card, ".machine_category", machine.category || "");
    setField(card, ".location-block h3", machine.location || "");
    setField(card, ".hour-value-3", machine.hours || 0);
    var priceEl = card.querySelector("h3.listing-address-2.price");
    if (priceEl) priceEl.textContent = commaNum(Math.round(machine.price || 0));
    var link = card.querySelector("a.link-block-21") || card.querySelector("a");
    if (link) link.href = machine.url || link.href;
    return card;
  }

  function renderGrid(items) {
    if (!els.grid || !cardTemplate) return;
    els.grid.innerHTML = "";
    items.forEach(function (machine) {
      els.grid.appendChild(renderCard(machine));
    });
    if (els.empty) {
      els.empty.style.display = items.length ? "none" : "block";
    }
  }

  function bindPaginationLink(link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      if (link.getAttribute("aria-disabled") === "true") return;
      var nextPage = parseInt(link.getAttribute("data-page"), 10);
      if (!isFinite(nextPage) || nextPage < 1) return;
      var f = readFilters();
      f.page = nextPage;
      fetchAndRender(f);
      els.grid.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  function renderPagination(pagination) {
    if (!els.pagination) return;
    var page = pagination.page;
    var totalPages = pagination.totalPages;

    if (totalPages <= 1) {
      els.pagination.innerHTML = "";
      els.pagination.style.display = "none";
      return;
    }
    els.pagination.style.display = "";

    var prevDisabled = page <= 1;
    var nextDisabled = page >= totalPages;

    els.pagination.innerHTML =
      '<a href="#" data-page="' +
      (page - 1) +
      '" aria-label="Previous Page" class="w-pagination-previous' +
      (prevDisabled ? " is-list-pagination-disabled" : "") +
      '"' +
      (prevDisabled ? ' aria-disabled="true" tabindex="-1"' : "") +
      ">Previous</a>" +
      '<div class="ue-pagination-status w-pagination-page w-active">Page ' +
      page +
      " of " +
      totalPages +
      "</div>" +
      '<a href="#" data-page="' +
      (page + 1) +
      '" aria-label="Next Page" class="w-pagination-next' +
      (nextDisabled ? " is-list-pagination-disabled" : "") +
      '"' +
      (nextDisabled ? ' aria-disabled="true" tabindex="-1"' : "") +
      ">Next</a>";

    els.pagination.querySelectorAll("[data-page]").forEach(bindPaginationLink);
  }

  function initDualRangeSlider(opts) {
    var wrapper = opts.wrapper;
    if (!wrapper) return null;

    var track = wrapper.querySelector(".fs-rangeslider_track");
    var fill = wrapper.querySelector(".fs-rangeslider_fill");
    var handles = wrapper.querySelectorAll(".fs-rangeslider_handle");
    if (!track || handles.length < 2) return null;

    var loHandle = handles[0];
    var hiHandle = handles[1];
    var state = {
      min: opts.min,
      max: opts.max,
      step: opts.step || 1,
    };
    var activeHandle = null;
    var rangeTimer = null;

    function snap(v) {
      return Math.round(v / state.step) * state.step;
    }

    function clamp(v) {
      return Math.max(state.min, Math.min(state.max, v));
    }

    function readLoHi() {
      var lo = parseInputNumber(opts.minInput);
      var hi = parseInputNumber(opts.maxInput);
      if (lo == null) lo = state.min;
      if (hi == null) hi = state.max;
      lo = clamp(snap(Math.min(lo, hi)));
      hi = clamp(snap(Math.max(lo, hi)));
      return { lo: lo, hi: hi };
    }

    function format(v) {
      return opts.format ? opts.format(v) : String(v);
    }

    function paint(lo, hi) {
      var span = state.max - state.min || 1;
      var leftPct = ((lo - state.min) / span) * 100;
      var rightPct = ((hi - state.min) / span) * 100;
      loHandle.style.left = leftPct + "%";
      hiHandle.style.left = rightPct + "%";
      if (fill) {
        fill.style.left = leftPct + "%";
        fill.style.width = Math.max(0, rightPct - leftPct) + "%";
      }
      var displays = opts.displays || [];
      if (displays[0]) displays[0].textContent = format(lo);
      if (displays[1]) displays[1].textContent = format(hi);
    }

    function valueFromClientX(clientX) {
      var rect = track.getBoundingClientRect();
      if (!rect.width) return state.min;
      var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return clamp(snap(state.min + ratio * (state.max - state.min)));
    }

    function triggerFilterDebounced() {
      clearTimeout(rangeTimer);
      rangeTimer = setTimeout(function () {
        onFilterChange(true);
      }, RANGE_DEBOUNCE_MS);
    }

    function onPointerMove(e) {
      if (!activeHandle) return;
      var val = valueFromClientX(e.clientX);
      var v = readLoHi();
      if (activeHandle === loHandle) {
        v.lo = Math.min(val, v.hi);
        if (opts.minInput) {
          opts.minInput.value = v.lo > state.min ? String(v.lo) : "";
        }
      } else {
        v.hi = Math.max(val, v.lo);
        if (opts.maxInput) {
          opts.maxInput.value = v.hi < state.max ? String(v.hi) : "";
        }
      }
      paint(v.lo, v.hi);
    }

    function onPointerUp() {
      if (!activeHandle) return;
      activeHandle = null;
      document.removeEventListener("pointermove", onPointerMove);
      document.removeEventListener("pointerup", onPointerUp);
      triggerFilterDebounced();
    }

    function onPointerDown(e, handle) {
      e.preventDefault();
      activeHandle = handle;
      document.addEventListener("pointermove", onPointerMove);
      document.addEventListener("pointerup", onPointerUp);
    }

    loHandle.addEventListener("pointerdown", function (e) {
      onPointerDown(e, loHandle);
    });
    hiHandle.addEventListener("pointerdown", function (e) {
      onPointerDown(e, hiHandle);
    });

    function syncFromInputs(triggerFilter) {
      var v = readLoHi();
      paint(v.lo, v.hi);
      if (triggerFilter) triggerFilterDebounced();
    }

    function bindRangeInput(el) {
      if (!el) return;
      el.addEventListener("input", function () {
        syncFromInputs(true);
      });
      el.addEventListener("change", function () {
        syncFromInputs(true);
      });
    }

    bindRangeInput(opts.minInput);
    bindRangeInput(opts.maxInput);

    if (opts.minInput) opts.minInput.placeholder = String(state.min);
    if (opts.maxInput) opts.maxInput.placeholder = String(state.max);
    var initial = readLoHi();
    paint(initial.lo, initial.hi);

    return {
      setBounds: function (min, max) {
        state.min = min;
        state.max = max;
        if (opts.minInput) opts.minInput.placeholder = String(min);
        if (opts.maxInput) opts.maxInput.placeholder = String(max);
        var v = readLoHi();
        paint(v.lo, v.hi);
      },
      sync: function () {
        var v = readLoHi();
        paint(v.lo, v.hi);
      },
      reset: function () {
        if (opts.minInput) opts.minInput.value = "";
        if (opts.maxInput) opts.maxInput.value = "";
        paint(state.min, state.max);
      },
    };
  }

  function initRangeSliders() {
    var yearWrapper = els.yearMin && els.yearMin.closest(".fs-rangeslider_wrapper");
    var priceWrapper = els.priceMin && els.priceMin.closest(".fs-rangeslider_wrapper");

    if (yearWrapper) {
      rangeSliders.year = initDualRangeSlider({
        wrapper: yearWrapper,
        minInput: els.yearMin,
        maxInput: els.yearMax,
        min: catalogBounds.yearMin,
        max: catalogBounds.yearMax,
        step: 1,
        displays: yearWrapper.querySelectorAll(".range-slider-value"),
        format: String,
      });
    }

    if (priceWrapper) {
      var priceDisplays = [];
      var d52 = priceWrapper.querySelector(".div-block-52 .range-slider-value");
      var d53 = priceWrapper.querySelector(".div-block-53 .range-slider-value");
      if (d52) priceDisplays.push(d52);
      if (d53) priceDisplays.push(d53);
      if (!priceDisplays.length) {
        priceDisplays = Array.prototype.slice.call(
          priceWrapper.querySelectorAll(".range-slider-value")
        );
      }

      rangeSliders.price = initDualRangeSlider({
        wrapper: priceWrapper,
        minInput: els.priceMin,
        maxInput: els.priceMax,
        min: catalogBounds.priceMin,
        max: catalogBounds.priceMax,
        step: 5000,
        displays: priceDisplays,
        format: function (v) {
          return commaNum(v);
        },
      });
    }
  }

  function setLoading(isLoading) {
    loading = isLoading;
    if (els.wrapper) {
      els.wrapper.style.opacity = isLoading ? "0.55" : "1";
      els.wrapper.style.pointerEvents = isLoading ? "none" : "";
    }
  }

  function fetchAndRender(filters) {
    if (loading) return;
    setLoading(true);
    syncUrl(filters);

    fetch(buildApiUrl(filters))
      .then(function (res) {
        if (!res.ok) throw new Error("API " + res.status);
        return res.json();
      })
      .then(function (data) {
        applyCatalogBounds(data.bounds);
        updateSelectOptions(data.filterOptions || {}, filters);
        renderGrid(data.items || []);
        renderPagination(data.pagination || { page: 1, totalPages: 1 });
      })
      .catch(function (err) {
        console.error("[used-equipment]", err);
        if (els.empty) els.empty.style.display = "block";
      })
      .finally(function () {
        setLoading(false);
      });
  }

  function onFilterChange(resetPage) {
    var filters = readFilters();
    if (resetPage) filters.page = 1;
    fetchAndRender(filters);
  }

  function resetFilters() {
    if (els.search) els.search.value = "";
    if (els.category) els.category.value = "";
    if (els.make) els.make.value = "";
    if (els.model) els.model.value = "";
    if (els.location) els.location.value = "";
    if (rangeSliders.year) rangeSliders.year.reset();
    if (rangeSliders.price) rangeSliders.price.reset();
    var filters = readFilters();
    filters.page = 1;
    fetchAndRender(filters);
  }

  function bindEvents() {
    if (els.category) {
      els.category.addEventListener("change", function () {
        if (els.make) els.make.value = "";
        if (els.model) els.model.value = "";
        if (els.location) els.location.value = "";
        onFilterChange(true);
      });
    }
    if (els.make) {
      els.make.addEventListener("change", function () {
        if (els.model) els.model.value = "";
        if (els.location) els.location.value = "";
        onFilterChange(true);
      });
    }
    if (els.model) {
      els.model.addEventListener("change", function () {
        if (els.location) els.location.value = "";
        onFilterChange(true);
      });
    }
    if (els.location) {
      els.location.addEventListener("change", function () {
        onFilterChange(true);
      });
    }

    if (els.search) {
      els.search.addEventListener("input", function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          onFilterChange(true);
        }, SEARCH_DEBOUNCE_MS);
      });
    }

    if (els.reset) {
      els.reset.addEventListener("click", function (e) {
        e.preventDefault();
        resetFilters();
      });
    }

    if (els.form) {
      els.form.addEventListener("submit", function (e) {
        e.preventDefault();
        onFilterChange(true);
      });
    }
  }

  function init() {
    if (!els.grid) {
      console.error("[used-equipment] #main-list not found");
      return;
    }

    if (els.wrapper) {
      els.empty = els.wrapper.querySelector(".w-dyn-empty");
      els.pagination = els.wrapper.querySelector(".w-pagination-wrapper");
    }

    ensureCardTemplate();
    if (!cardTemplate) return;

    initRangeSliders();
    applyFiltersFromUrl();
    if (rangeSliders.year) rangeSliders.year.sync();
    if (rangeSliders.price) rangeSliders.price.sync();

    bindEvents();
    fetchAndRender(readFilters());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
